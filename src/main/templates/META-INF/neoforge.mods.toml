modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
issueTrackerURL="https://github.com/Christofmeg/Rechiseled-AE2/issues"
license="${license}"
[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Christofmeg/Rechiseled-AE2"
    logoFile= "../../icon.png"
    authors="${mod_author}"
    description="${mod_description}"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version_range},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${neoforge_minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="ANY"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="rechiseled"
    type="required"
    versionRange="ANY"
    ordering="AFTER"
    side="BOTH"