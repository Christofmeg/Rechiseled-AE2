import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.113' // https://projects.neoforged.net/neoforged/ModDevGradle
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = "${mod_id}-neoforge-${neoforge_supported_versions}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_mc
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDirs = ['src/main/resources', 'src/generated/resources'] }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    runtimeOnly "curse.maven:jei-238222:6614392"

    // CATALOGUE
    if (project.hasProperty('catalogue_version')) {
        runtimeOnly "curse.maven:catalogue-459701:${catalogue_version}"
    }
    // CONFIGURED
    if (project.hasProperty('configured_version')) {
        runtimeOnly "curse.maven:configured-457570:${configured_version}"
    }
    
    implementation "curse.maven:applied-energistics-2-223794:7027323" // https://www.curseforge.com/minecraft/mc-mods/applied-energistics-2/files
    implementation "curse.maven:guideme-1173950:6812025" // https://www.curseforge.com/minecraft/mc-mods/guideme/files
    implementation "curse.maven:rechiseled-558998:5663514" // https://www.curseforge.com/minecraft/mc-mods/rechiseled/files
    implementation "curse.maven:fusion-connected-textures-854949:7058347" // https://www.curseforge.com/minecraft/mc-mods/fusion-connected-textures/files
    implementation "curse.maven:supermartijn642s-config-lib-438332:5546996" // https://www.curseforge.com/minecraft/mc-mods/supermartijn642s-config-lib/files
    implementation "curse.maven:supermartijn642s-core-lib-454372:6076757" // https://www.curseforge.com/minecraft/mc-mods/supermartijn642s-core-lib/files

    implementation "curse.maven:jade-324717:6853386" // https://www.curseforge.com/minecraft/mc-mods/jade/files
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version             : minecraft_version,
            neoforge_version              : neoforge_version,
            neoforge_version_range        : neoforge_version_range,
            neoforge_loader_version_range   : neoforge_loader_version_range,
            neoforge_minecraft_version_range : neoforge_minecraft_version_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            license                       : license,
            version                       : version,
            mod_author                    : mod_author,
            mod_description               : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    exclude '.cache'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 🧩 Keep original resource files; skip generated duplicates
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = file('../API Tokens/rechiseledae2.md')
    def projectId = "${cf_id}".toString()
    def mainFile = upload(projectId, file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar")) as Object
    mainFile.changelogType = 'markdown'
    mainFile.changelog = file('changelog.md')
    mainFile.addGameVersion('Client', 'Server')
    mainFile.releaseType = "${release_type}"
    mainFile.addModLoader("neoforge")
    "${neoforge_release_versions}".split(',').each {
        mainFile.addGameVersion("${it}")
    }
    mainFile.addRequirement("applied-energistics-2")
    mainFile.addRequirement("rechiseled")
}

modrinth {
    token = file('../API Tokens/modrinth.md').text
    projectId = "${modrinth_id}"
    versionName = getArchivesBaseName() + "-" + getVersion()
    versionType = "${release_type}"
    changelog = file('changelog.md').text
    uploadFile = file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar")
    gameVersions = "${neoforge_release_versions}".split(",") as List<String>
    dependencies {
        required.project "ae2"
        required.project "rechiseled"
    }
}